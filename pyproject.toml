[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phenotopo"
version = "0.5.0"
description = "Phenotype QC, outlier detection and robust cohort structure for HPO / Phenopacket rare-disease cohorts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Margarita Soloshenko", email = "margosoloshenko@mail.ru" }]
keywords = ["phenotype", "HPO", "Phenopacket", "rare disease", "quality control", "outlier detection", "genotype-phenotype", "visualization", "PAGA"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "networkx>=3.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
hyperbolic = ["gensim>=4.3"]
tda = ["kmapper>=2.0"]
all = ["gensim>=4.3", "kmapper>=2.0", "umap-learn>=0.5", "adjustText>=1.0"]
dev = ["pytest>=7.0", "gensim>=4.3", "kmapper>=2.0", "adjustText>=1.0"]

[project.scripts]
phenotopo = "phenotopo.cli:main"

[project.urls]
Homepage = "https://github.com/MargoSolo/phenotopo"
Issues = "https://github.com/MargoSolo/phenotopo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/phenotopo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
